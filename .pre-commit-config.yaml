default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2048']

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l .); if [ -n "$out" ]; then echo "$out"; exit 1; fi'
        language: system
        pass_filenames: false
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: no-em-dashes
        name: no em-dashes anywhere
        language: pygrep
        entry: "\u2014"
        types_or: [text, go, markdown, yaml, shell, makefile]
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-ai-attribution
        name: no AI or Claude attribution
        language: pygrep
        entry: '(?i)(co-authored-by:?\s*claude|generated (by|with) claude|generated by anthropic|🤖 generated)'
        exclude: ^\.pre-commit-config\.yaml$

      - id: commit-msg-no-em-dashes
        name: no em-dashes in commit messages
        language: pygrep
        entry: "\u2014"
        stages: [commit-msg]

      - id: commit-msg-no-ai-attribution
        name: no AI attribution in commit messages
        language: pygrep
        entry: '(?i)(co-authored-by:?\s*claude|generated (by|with) claude|generated by anthropic|🤖 generated)'
        stages: [commit-msg]
